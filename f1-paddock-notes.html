<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 2026 · 围场笔记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --f1-black: #15151e; --f1-dark: #1f1f2b; --f1-gray: #2a2a3a;
            --f1-red: #e10600; --f1-red-glow: rgba(225, 6, 0, 0.6);
            --f1-white: #ffffff; --f1-silver: #c0c0c0;
            --f1-teal: #00d2be; --f1-yellow: #ffd700;
        }
        body {
            background-color: var(--f1-black);
            background-image: radial-gradient(circle at 10% 20%, rgba(225, 6, 0, 0.08) 0%, transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(0, 210, 190, 0.06) 0%, transparent 35%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
            font-family: 'Inter', sans-serif; color: var(--f1-white); min-height: 100vh;
            display: flex; justify-content: center; padding: 20px 16px 40px;
        }
        .f1-app {
            width: 100%; max-width: 1300px; background: rgba(21, 21, 30, 0.75);
            backdrop-filter: blur(4px); border-radius: 32px;
            border: 1px solid rgba(225, 6, 0, 0.3);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            padding: 24px 28px 32px; position: relative; overflow: hidden;
        }
        .f1-app::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, var(--f1-red) 0%, var(--f1-red) 15%, #ffffff 15%, #ffffff 18%, var(--f1-red) 18%, var(--f1-red) 33%, #ffffff 33%, #ffffff 36%, var(--f1-red) 36%, var(--f1-red) 50%, #ffffff 50%, #ffffff 53%, var(--f1-red) 53%, var(--f1-red) 100%);
            opacity: 0.9;
        }
        .f1-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; flex-wrap: wrap; gap: 16px; position: relative; z-index: 2;
        }
        .f1-brand { display: flex; align-items: center; gap: 14px; }
        .f1-logo {
            font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 20%, #ffb6b6 50%, var(--f1-red) 80%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 30px rgba(225, 6, 0, 0.4); line-height: 1;
        }
        .f1-logo span {
            font-size: 1rem; font-weight: 600; color: var(--f1-silver);
            background: none; -webkit-text-fill-color: var(--f1-silver);
            margin-left: 6px; letter-spacing: 2px;
        }
        .live-badge {
            background: var(--f1-red); color: black; font-weight: 800; font-size: 0.7rem;
            padding: 5px 14px; border-radius: 40px; letter-spacing: 1px;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 0 20px var(--f1-red-glow); animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 10px var(--f1-red-glow); }
            50% { box-shadow: 0 0 25px var(--f1-red-glow); }
            100% { box-shadow: 0 0 10px var(--f1-red-glow); }
        }
        .season-tag {
            background: var(--f1-gray); padding: 8px 20px; border-radius: 40px;
            font-weight: 700; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.1);
            color: var(--f1-silver);
        }
        .tabs {
            display: flex; gap: 6px; margin-bottom: 28px;
            background: rgba(0,0,0,0.3); padding: 6px; border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.05); flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent; border: none; color: #a0a0b0;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.95rem;
            padding: 12px 28px; border-radius: 50px; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 10px;
            letter-spacing: 0.3px; flex: 1 1 auto; justify-content: center; white-space: nowrap;
        }
        .tab-btn i { font-size: 1.1rem; }
        .tab-btn:hover { color: white; background: rgba(255,255,255,0.05); }
        .tab-btn.active {
            background: var(--f1-red); color: black; font-weight: 700;
            box-shadow: 0 0 20px rgba(225, 6, 0, 0.5);
        }
        .tab-pane { display: none; animation: fadeIn 0.3s ease; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card {
            background: rgba(30, 30, 42, 0.7); border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.06); padding: 24px;
            backdrop-filter: blur(4px); transition: border-color 0.2s;
        }
        .card:hover { border-color: rgba(225, 6, 0, 0.3); }
        .card-title {
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.2rem;
            letter-spacing: 0.5px; margin-bottom: 20px; display: flex; align-items: center;
            gap: 12px; color: #ffffff; border-bottom: 2px solid var(--f1-red);
            padding-bottom: 12px; width: fit-content;
        }
        .calendar-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; }
        @media (max-width: 900px) { .calendar-grid { grid-template-columns: 1fr; } }
        .race-list {
            display: flex; flex-direction: column; gap: 12px; max-height: 580px;
            overflow-y: auto; padding-right: 6px;
        }
        .race-item {
            display: grid; grid-template-columns: 38px 1fr auto; align-items: center;
            gap: 14px; background: rgba(0,0,0,0.25); padding: 14px 18px;
            border-radius: 16px; border-left: 4px solid var(--f1-red);
            transition: all 0.15s; border: 1px solid rgba(255,255,255,0.03);
            border-left-width: 4px;
        }
        .race-item:hover { background: rgba(225, 6, 0, 0.08); border-color: rgba(225, 6, 0, 0.3); }
        .race-round {
            font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 1.3rem;
            color: var(--f1-red); text-align: center; line-height: 1;
        }
        .race-info h4 { font-weight: 700; font-size: 1rem; margin-bottom: 4px; color: white; }
        .race-info .race-meta {
            font-size: 0.78rem; color: #a0a0b0; display: flex; flex-wrap: wrap; gap: 12px;
        }
        .race-time {
            font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 0.85rem;
            background: rgba(225, 6, 0, 0.15); padding: 6px 14px; border-radius: 30px;
            color: #ffb6b6; white-space: nowrap; border: 1px solid rgba(225, 6, 0, 0.3);
        }
        .standings-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        .driver-standings, .team-standings {
            background: rgba(0,0,0,0.2); border-radius: 20px; padding: 18px;
        }
        .standings-title {
            font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700;
            letter-spacing: 1px; color: var(--f1-red); margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .standing-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; border-radius: 12px; margin-bottom: 6px;
            background: rgba(255,255,255,0.03); border-left: 3px solid transparent;
            transition: all 0.15s;
        }
        .standing-row:hover { background: rgba(255,255,255,0.06); }
        .pos {
            font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 1rem;
            width: 36px; color: var(--f1-red);
        }
        .driver-name, .team-name {
            font-weight: 600; display: flex; align-items: center; gap: 8px; flex: 1;
        }
        .team-color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .points {
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1rem;
            color: var(--f1-yellow); background: rgba(255, 215, 0, 0.1);
            padding: 4px 12px; border-radius: 20px;
        }
        .live-update-badge {
            display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem;
            background: var(--f1-red); color: black; padding: 3px 12px;
            border-radius: 40px; font-weight: 800; margin-left: 12px;
            animation: pulse-red 1.5s infinite;
        }
        .diary-layout { display: grid; grid-template-columns: 1fr 1.1fr; gap: 28px; }
        @media (max-width: 900px) { .diary-layout { grid-template-columns: 1fr; } }
        .diary-form {
            background: rgba(0,0,0,0.25); border-radius: 24px; padding: 24px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 600; color: #b0b0c0;
            margin-bottom: 6px; letter-spacing: 0.5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; padding: 14px 18px; color: white;
            font-family: 'Inter', sans-serif; font-size: 0.95rem;
            transition: all 0.2s; outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--f1-red); box-shadow: 0 0 0 3px rgba(225, 6, 0, 0.2);
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .rating-stars { display: flex; gap: 8px; font-size: 1.6rem; color: #555; cursor: pointer; padding: 5px 0; }
        .rating-stars i { transition: color 0.15s; }
        .rating-stars i.active { color: var(--f1-yellow); text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
        .btn-submit {
            background: var(--f1-red); border: none; color: black; font-weight: 800;
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
            padding: 16px 28px; border-radius: 50px; cursor: pointer; width: 100%;
            font-size: 0.9rem; transition: all 0.2s;
            box-shadow: 0 0 20px rgba(225, 6, 0, 0.3);
        }
        .btn-submit:hover { background: #ff1e1e; transform: scale(1.02); box-shadow: 0 0 35px rgba(225, 6, 0, 0.6); }
        .diary-entries {
            display: flex; flex-direction: column; gap: 14px; max-height: 560px;
            overflow-y: auto; padding-right: 6px;
        }
        .diary-entry {
            background: rgba(0,0,0,0.25); border-radius: 18px; padding: 18px 20px;
            border-left: 4px solid var(--f1-red); border: 1px solid rgba(255,255,255,0.05);
            border-left-width: 4px; transition: all 0.15s;
        }
        .diary-entry:hover { background: rgba(225, 6, 0, 0.05); }
        .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .entry-author { display: flex; align-items: center; gap: 10px; }
        .author-avatar {
            width: 34px; height: 34px; background: var(--f1-red); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.8rem; color: black;
        }
        .author-name { font-weight: 700; font-size: 0.9rem; }
        .entry-race { font-size: 0.75rem; color: #b0b0c0; }
        .entry-rating { color: var(--f1-yellow); font-size: 1rem; letter-spacing: 2px; }
        .entry-content { font-size: 0.9rem; line-height: 1.6; color: #d0d0e0; margin-top: 8px; word-break: break-word; }
        .entry-time {
            font-size: 0.65rem; color: #6a6a7a; margin-top: 10px;
            text-align: right; font-family: 'Orbitron', sans-serif;
        }
        .drivers-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
        @media (max-width: 950px) { .drivers-layout { grid-template-columns: 1fr; } }
        .driver-table { background: rgba(0,0,0,0.2); border-radius: 24px; padding: 8px; overflow-x: auto; }
        .driver-row {
            display: grid; grid-template-columns: 44px 1fr 70px 90px 100px 70px;
            align-items: center; gap: 10px; padding: 14px 16px;
            border-radius: 14px; border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.15s;
        }
        .driver-row:hover { background: rgba(225, 6, 0, 0.05); }
        .driver-row-header {
            font-size: 0.65rem; font-weight: 700; color: #7a7a8a;
            text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px; margin-bottom: 4px;
        }
        .driver-number { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 1rem; color: var(--f1-red); }
        .driver-name-cell { font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .team-badge {
            font-size: 0.6rem; font-weight: 700; padding: 3px 8px; border-radius: 20px;
            color: black; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap;
        }
        .driver-points { font-family: 'Orbitron', sans-serif; font-weight: 700; color: var(--f1-yellow); text-align: center; }
        .msg-btn {
            background: rgba(225, 6, 0, 0.15); border: 1px solid rgba(225, 6, 0, 0.3);
            color: white; padding: 8px 0; border-radius: 30px; font-size: 0.75rem;
            font-weight: 600; cursor: pointer; transition: all 0.15s;
            font-family: 'Inter', sans-serif; width: 100%;
        }
        .msg-btn:hover { background: var(--f1-red); color: black; font-weight: 700; }
        .message-panel {
            background: rgba(0,0,0,0.25); border-radius: 24px; padding: 22px;
            border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column;
            height: fit-content; max-height: 620px;
        }
        .message-panel h3 {
            font-family: 'Orbitron', sans-serif; font-size: 1rem; margin-bottom: 16px;
            color: var(--f1-red); display: flex; align-items: center; gap: 10px;
        }
        .selected-driver-info {
            background: rgba(225, 6, 0, 0.1); padding: 12px 16px; border-radius: 14px;
            margin-bottom: 16px; font-weight: 600; display: flex; align-items: center;
            gap: 10px; border-left: 3px solid var(--f1-red);
        }
        .message-list {
            flex: 1; overflow-y: auto; max-height: 340px; display: flex;
            flex-direction: column; gap: 10px; margin-bottom: 16px; padding-right: 4px;
        }
        .message-item {
            background: rgba(0,0,0,0.3); border-radius: 14px; padding: 12px 16px;
            border-left: 3px solid var(--f1-red); font-size: 0.85rem;
        }
        .message-author {
            font-weight: 700; color: var(--f1-silver); font-size: 0.75rem;
            display: flex; justify-content: space-between; margin-bottom: 4px;
        }
        .message-text { color: #d0d0e0; line-height: 1.5; }
        .message-input-area { display: flex; gap: 8px; }
        .message-input-area input {
            flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; padding: 12px 18px; color: white;
            font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none;
        }
        .message-input-area input:focus { border-color: var(--f1-red); }
        .message-input-area button {
            background: var(--f1-red); border: none; border-radius: 40px;
            width: 48px; height: 48px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; color: black; font-size: 1.1rem;
            transition: all 0.15s;
        }
        .message-input-area button:hover { background: #ff1e1e; transform: scale(1.05); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--f1-red); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff1e1e; }
        .empty-state { color: #6a6a7a; font-style: italic; text-align: center; padding: 30px 20px; font-size: 0.85rem; }
        
        /* 更新后的页脚 */
        .f1-footer {
            text-align: center; margin-top: 32px; font-size: 0.75rem; color: #8a8a9a;
            letter-spacing: 0.5px; border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px; font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; gap: 6px;
        }
        .f1-footer .credits {
            font-family: 'Orbitron', sans-serif;
            color: #d0d0e0;
            letter-spacing: 1px;
        }
        .f1-footer .credits span {
            color: var(--f1-red);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="f1-app">
        <div class="f1-header">
            <div class="f1-brand">
                <div class="f1-logo">F1<span>2026</span></div>
                <div class="live-badge"><i class="fas fa-circle" style="font-size: 0.5rem;"></i> 围场笔记</div>
            </div>
            <div class="season-tag"><i class="fas fa-flag-checkered" style="margin-right: 8px;"></i>2026 赛季 · 中国时区</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="tab1"><i class="fas fa-calendar-alt"></i> 赛历 & 积分</button>
            <button class="tab-btn" data-tab="tab2"><i class="fas fa-pen-fancy"></i> 观赛日记</button>
            <button class="tab-btn" data-tab="tab3"><i class="fas fa-comment-dots"></i> 车手留言</button>
        </div>

        <div id="tab1" class="tab-pane active">
            <div class="calendar-grid">
                <div class="card">
                    <div class="card-title"><i class="fas fa-flag"></i> 2026 赛历</div>
                    <div class="race-list" id="raceList"></div>
                </div>
                <div class="standings-grid">
                    <div class="card driver-standings">
                        <div class="standings-title">
                            <i class="fas fa-user-astronaut"></i> 车手积分榜
                            <span class="live-update-badge" id="syncBadge"><i class="fas fa-sync-alt"></i> 实时同步</span>
                        </div>
                        <div id="driverStandingsList"></div>
                    </div>
                    <div class="card team-standings">
                        <div class="standings-title"><i class="fas fa-users"></i> 车队积分榜</div>
                        <div id="teamStandingsList"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab2" class="tab-pane">
            <div class="diary-layout">
                <div class="diary-form">
                    <div class="card-title" style="border-bottom-color: var(--f1-teal);"><i class="fas fa-feather-alt"></i> 记录观赛感受</div>
                    <div class="form-group">
                        <label>你的ID / 昵称</label>
                        <input type="text" id="diaryAuthor" placeholder="例如: 法拉利车迷" value="车迷" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label>选择比赛</label>
                        <select id="diaryRace"></select>
                    </div>
                    <div class="form-group">
                        <label>比赛评分</label>
                        <div class="rating-stars" id="ratingStars">
                            <i class="far fa-star" data-rating="1"></i>
                            <i class="far fa-star" data-rating="2"></i>
                            <i class="far fa-star" data-rating="3"></i>
                            <i class="far fa-star" data-rating="4"></i>
                            <i class="far fa-star" data-rating="5"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>观赛感受</label>
                        <textarea id="diaryContent" placeholder="说说这场比赛的亮点、策略、你的心情..."></textarea>
                    </div>
                    <button class="btn-submit" id="submitDiary"><i class="fas fa-save" style="margin-right: 8px;"></i> 发布日记</button>
                </div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-book-open"></i> 车迷日记 <span style="font-size:0.7rem;font-weight:400;color:#6a6a7a;margin-left:8px;">实时同步</span></div>
                    <div class="diary-entries" id="diaryEntries"></div>
                </div>
            </div>
        </div>

        <div id="tab3" class="tab-pane">
            <div class="drivers-layout">
                <div class="card">
                    <div class="card-title"><i class="fas fa-helmet-safety"></i> 2026 车手阵容</div>
                    <div class="driver-table" id="driverTable"></div>
                </div>
                <div class="message-panel" id="messagePanel">
                    <h3><i class="fas fa-comments"></i> 给车手留言 <span style="font-size:0.7rem;font-weight:400;color:#6a6a7a;margin-left:auto;">实时同步</span></h3>
                    <div class="selected-driver-info" id="selectedDriverInfo">
                        <i class="fas fa-user-circle"></i> 请选择一位车手
                    </div>
                    <div class="message-list" id="messageList">
                        <div class="empty-state">选择车手后，这里会显示所有留言</div>
                    </div>
                    <div class="message-input-area">
                        <input type="text" id="messageInput" placeholder="说点什么..." maxlength="120" disabled>
                        <button id="sendMessageBtn" disabled><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 更新后的署名区域 -->
        <div class="f1-footer">
            <div class="credits">
                <i class="fas fa-bolt" style="color: var(--f1-red);"></i> 
                F1 2026 围场笔记 · 创意提供 & 手搓 <span>@cry</span> · 无偿劳动 & 致谢 <span>@聪明伶俐的deepseek宝宝</span>
            </div>

        ];

        // ========== 全局状态 ==========
        let driversData = [];
        let teamPointsMap = {};
        let diaryEntries = [];
        let allMessages = {};
        let selectedDriverNumber = null;
        let currentRating = 3;

        // ---------- 工具 ----------
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function isLightColor(hex) {
            const c = hex.substring(1);
            const rgb = parseInt(c, 16);
            const r = (rgb >> 16) & 0xff, g = (rgb >> 8) & 0xff, b = (rgb >> 0) & 0xff;
            return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 128;
        }
        function toArray(obj) {
            if (!obj) return [];
            return Object.values(obj).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        }

        // ---------- 渲染赛历 ----------
        function renderRaceList() {
            document.getElementById('raceList').innerHTML = races2026.map(r => `
                <div class="race-item">
                    <div class="race-round">${r.round}</div>
                    <div class="race-info">
                        <h4>${r.country} ${r.name}</h4>
                        <div class="race-meta">
                            <span><i class="fas fa-map-pin"></i> ${r.circuit}</span>
                            <span><i class="far fa-calendar"></i> ${r.date}</span>
                        </div>
                    </div>
                    <div class="race-time"><i class="far fa-clock"></i> ${r.time} (UTC+8)</div>
                </div>
            `).join('');
        }

        // ---------- 渲染积分榜 ----------
        function renderDriverStandings() {
            const sorted = [...driversData].sort((a, b) => b.points - a.points);
            document.getElementById('driverStandingsList').innerHTML = sorted.map((d, idx) => `
                <div class="standing-row">
                    <span class="pos">${idx + 1}</span>
                    <span class="driver-name">
                        <span class="team-color-dot" style="background: ${d.teamColor};"></span>
                        ${escapeHtml(d.name)}
                    </span>
                    <span class="points">${d.points}</span>
                </div>
            `).join('');
        }

        function renderTeamStandings() {
            const teams = [
                { name: "Mercedes",     color: "#27f4d2" },
                { name: "Ferrari",      color: "#e8002d" },
                { name: "Red Bull",     color: "#3671c6" },
                { name: "McLaren",      color: "#ff8000" },
                { name: "Racing Bulls", color: "#6692ff" },
                { name: "Alpine",       color: "#ff87bc" },
                { name: "Haas",         color: "#b6babd" },
                { name: "Sauber",       color: "#52e252" },
                { name: "Williams",     color: "#64c4ff" },
                { name: "Aston Martin", color: "#229971" },
                { name: "Cadillac",     color: "#C0C0C0" },
            ];
            const sorted = teams.sort((a, b) => (teamPointsMap[b.name] || 0) - (teamPointsMap[a.name] || 0));
            document.getElementById('teamStandingsList').innerHTML = sorted.map((t, idx) => `
                <div class="standing-row">
                    <span class="pos">${idx + 1}</span>
                    <span class="team-name">
                        <span class="team-color-dot" style="background: ${t.color};"></span>
                        ${t.name}
                    </span>
                    <span class="points">${teamPointsMap[t.name] || 0}</span>
                </div>
            `).join('');
        }

        // ---------- 渲染车手表格 ----------
        function renderDriverTable() {
            const container = document.getElementById('driverTable');
            if (!container) return;
            const header = `
                <div class="driver-row driver-row-header">
                    <span>车号</span><span>车手</span><span>车队</span>
                    <span style="text-align: center;">积分</span>
                    <span style="text-align: center;">留言</span>
                    <span style="text-align: center;">操作</span>
                </div>
            `;
            const rows = driversData.map(d => {
                const msgCount = toArray(allMessages[d.number]).length;
                return `
                    <div class="driver-row" data-driver-number="${d.number}">
                        <span class="driver-number">${d.number}</span>
                        <span class="driver-name-cell">${escapeHtml(d.name)}</span>
                        <span><span class="team-badge" style="background: ${d.teamColor}; color: ${isLightColor(d.teamColor) ? '#000' : '#fff'};">${d.team}</span></span>
                        <span class="driver-points">${d.points}</span>
                        <span style="text-align: center; font-size: 0.8rem; color: #b0b0c0;">${msgCount}</span>
                        <span><button class="msg-btn" data-driver="${d.number}"><i class="fas fa-comment"></i> 留言</button></span>
                    </div>
                `;
            }).join('');
            container.innerHTML = header + rows;
            container.querySelectorAll('.msg-btn').forEach(btn => {
                btn.addEventListener('click', () => selectDriver(parseInt(btn.dataset.driver)));
            });
        }

        // ---------- 渲染日记 ----------
        function renderDiaryEntries() {
            const container = document.getElementById('diaryEntries');
            if (diaryEntries.length === 0) {
                container.innerHTML = '<div class="empty-state">还没有日记，写下第一篇观赛感受吧！</div>';
                return;
            }
            container.innerHTML = diaryEntries.map(e => {
                const stars = '★'.repeat(e.rating) + '☆'.repeat(5 - e.rating);
                return `
                    <div class="diary-entry">
                        <div class="entry-header">
                            <div class="entry-author">
                                <div class="author-avatar">${(e.author || '?').charAt(0).toUpperCase()}</div>
                                <div>
                                    <div class="author-name">${escapeHtml(e.author || '匿名')}</div>
                                    <div class="entry-race">${escapeHtml(e.race || '')}</div>
                                </div>
                            </div>
                            <div class="entry-rating">${stars}</div>
                        </div>
                        <div class="entry-content">${escapeHtml(e.content || '')}</div>
                        <div class="entry-time">${e.time || ''}</div>
                    </div>
                `;
            }).join('');
        }

        // ---------- 渲染留言 ----------
        function renderMessages(driverNumber) {
            const messages = toArray(allMessages[driverNumber]);
            const container = document.getElementById('messageList');
            if (messages.length === 0) {
                container.innerHTML = '<div class="empty-state">还没有留言，成为第一个吧！</div>';
                return;
            }
            container.innerHTML = messages.map(m => `
                <div class="message-item">
                    <div class="message-author">
                        <span>${escapeHtml(m.author || '车迷')}</span>
                        <span style="font-size: 0.6rem; color: #6a6a7a;">${m.time || ''}</span>
                    </div>
                    <div class="message-text">${escapeHtml(m.content || '')}</div>
                </div>
            `).join('');
        }

        function selectDriver(driverNumber) {
            selectedDriverNumber = driverNumber;
            const driver = driversData.find(d => d.number === driverNumber);
            if (!driver) return;
            document.getElementById('selectedDriverInfo').innerHTML = `
                <i class="fas fa-user-circle"></i> 
                <span style="font-weight: 700;">${escapeHtml(driver.name)}</span>
                <span class="team-badge" style="background: ${driver.teamColor}; color: ${isLightColor(driver.teamColor) ? '#000' : '#fff'}; margin-left: 8px;">${driver.team}</span>
            `;
            const input = document.getElementById('messageInput');
            input.disabled = false;
            input.placeholder = `对 ${driver.name} 说...`;
            document.getElementById('sendMessageBtn').disabled = false;
            renderMessages(driverNumber);
        }

        // ---------- 初始化日记 UI ----------
        function initDiaryUI() {
            const select = document.getElementById('diaryRace');
            select.innerHTML = races2026.map(r => `<option value="${r.country} ${r.name} (R${r.round})">R${r.round} · ${r.country} ${r.name}</option>`).join('');
            const stars = document.querySelectorAll('#ratingStars i');
            function updateStars() {
                stars.forEach((s, idx) => {
                    s.className = idx < currentRating ? 'fas fa-star active' : 'far fa-star';
                });
            }
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    currentRating = parseInt(star.dataset.rating);
                    updateStars();
                });
            });
            updateStars();

            document.getElementById('submitDiary').addEventListener('click', () => {
                const author = document.getElementById('diaryAuthor').value.trim() || '匿名车迷';
                const race = document.getElementById('diaryRace').value;
                const content = document.getElementById('diaryContent').value.trim();
                if (!content) { alert('请填写观赛感受！'); return; }
                db.ref('diary').push({
                    author, race, content, rating: currentRating,
                    time: new Date().toLocaleString('zh-CN', { hour12: false }),
                    createdAt: Date.now()
                });
                document.getElementById('diaryContent').value = '';
            });
        }

        // ---------- 初始化留言 UI ----------
        function initMessagesUI() {
            const sendBtn = document.getElementById('sendMessageBtn');
            const input = document.getElementById('messageInput');
            sendBtn.addEventListener('click', () => {
                if (selectedDriverNumber === null) { alert('请先选择一位车手'); return; }
                const content = input.value.trim();
                if (!content) return;
                const author = document.getElementById('diaryAuthor')?.value.trim() || '车迷';
                db.ref('messages/' + selectedDriverNumber).push({
                    author, content,
                    time: new Date().toLocaleString('zh-CN', { hour12: false }),
                    createdAt: Date.now()
                }).catch(err => {
                    console.error('留言写入失败:', err);
                    alert('留言发送失败: ' + err.message);
                });
                input.value = '';
            });
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); sendBtn.click(); }
            });
        }

        // ---------- 标签页 ----------
        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab).classList.add('active');
                    if (btn.dataset.tab === 'tab3') {
                        renderDriverTable();
                        if (selectedDriverNumber !== null) selectDriver(selectedDriverNumber);
                    }
                });
            });
        }

        // ============================================================
        // 🔥 Firebase 实时监听
        // ============================================================

        // 1. 监听积分数据
        db.ref('standings').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.drivers && data.teams) {
                driversData = data.drivers;
                teamPointsMap = data.teams;
            } else {
                driversData = [
                    { number: 12, name: "基米·安东内利",     team: "Mercedes",     teamColor: "#27f4d2", points: 380 },
                    { number: 1,  name: "马克斯·维斯塔潘",   team: "Red Bull",     teamColor: "#3671c6", points: 261 },

                    { number: 63, name: "乔治·拉塞尔",       team: "Mercedes",     teamColor: "#27f4d2", points: 250 },
                    { number: 16, name: "查尔斯·勒克莱尔",   team: "Ferrari",      teamColor: "#e8002d", points: 245 },
                    { number: 4,  name: "兰多·诺里斯",       team: "McLaren",      teamColor: "#ff8000", points: 221 },
                    { number: 81, name: "奥斯卡·皮亚斯特里", team: "McLaren",      teamColor: "#ff8000", points: 150 },
                    { number: 6,  name: "伊萨克·哈贾尔",     team: "Red Bull",     teamColor: "#3671c6", points: 105 },
                    { number: 30, name: "利亚姆·劳森",       team: "Racing Bulls", teamColor: "#6692ff", points: 79 },
                    { number: 10, name: "皮埃尔·加斯利",     team: "Alpine",       teamColor: "#ff87bc", points: 43 },
                    { number: 41, name: "阿维德·林德布拉德", team: "Racing Bulls", teamColor: "#6692ff", points: 38 },
                    { number: 43, name: "弗兰科·科拉平托",   team: "Alpine",       teamColor: "#ff87bc", points: 27 },
                    { number: 87, name: "奥利弗·贝尔曼",     team: "Haas",         teamColor: "#b6babd", points: 23 },
                    { number: 5,  name: "加布里埃尔·博尔托莱托", team: "Sauber",   teamColor: "#52e252", points: 14 },
                    { number: 27, name: "尼科·霍肯伯格",     team: "Sauber",       teamColor: "#52e252", points: 13 },
                    { number: 55, name: "卡洛斯·塞恩斯",     team: "Williams",     teamColor: "#64c4ff", points: 7 },
                    { number: 14, name: "费尔南多·阿隆索",   team: "Aston Martin", teamColor: "#229971", points: 7 },
                    { number: 31, name: "埃斯特班·奥康",     team: "Haas",         teamColor: "#b6babd", points: 7 },
                    { number: 23, name: "亚历克斯·阿尔本",   team: "Williams",     teamColor: "#64c4ff", points: 5 },
                    { number: 18, name: "兰斯·斯特罗尔",     team: "Aston Martin", teamColor: "#229971", points: 0 },
                    { number: 11, name: "塞尔吉奥·佩雷斯",   team: "Cadillac",     teamColor: "#C0C0C0", points: 0 },
                    { number: 77, name: "瓦尔特利·博塔斯",   team: "Cadillac",     teamColor: "#C0C0C0", points: 0 },
                ];
                teamPointsMap = {
                    "Mercedes": 630, "Ferrari": 504, "Red Bull": 382, "McLaren": 365,
                    "Racing Bulls": 108, "Alpine": 69, "Haas": 31, "Sauber": 27,
                    "Williams": 12, "Aston Martin": 7, "Cadillac": 0
                };
                db.ref('standings').set({ drivers: driversData, teams: teamPointsMap });
            }
            renderDriverStandings();
            renderTeamStandings();
            renderDriverTable();
            if (selectedDriverNumber !== null) {
                const stillExists = driversData.some(d => d.number === selectedDriverNumber);
                if (stillExists) selectDriver(selectedDriverNumber);
            }
        });

        // 2. 监听日记
        db.ref('diary').orderByChild('createdAt').on('value', (snapshot) => {
            const val = snapshot.val();
            diaryEntries = toArray(val);
            renderDiaryEntries();
        });

        // 3. 监听所有留言
        db.ref('messages').on('value', (snapshot) => {
            allMessages = snapshot.val() || {};
            renderDriverTable();
            if (selectedDriverNumber !== null) renderMessages(selectedDriverNumber);
        });

        // ---------- 启动 ----------
        function init() {
            renderRaceList();
            initDiaryUI();
            initMessagesUI();
            initTabs();
        }

        init();
    </script>
