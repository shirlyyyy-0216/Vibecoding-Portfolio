<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>November 日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #eef3f7;
    --card: #ffffff;
    --card-soft: #f7fafc;
    --ink: #2b3a45;
    --ink-soft: #8299a8;
    --line: #e3ebf0;
    --accent: #7aa7c7;
    --accent-deep: #5b8bad;
    --glow: #c9dced;
  }

  body {
    font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(201,220,237,.55) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(201,220,237,.4) 0%, transparent 50%);
    color: var(--ink);
    min-height: 100vh;
    display: flex; justify-content: center;
    padding: 56px 24px;
    -webkit-font-smoothing: antialiased;
  }

  .app { width: 100%; max-width: 940px; }

  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 36px; flex-wrap: wrap; gap: 14px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: 46px; font-weight: 500; letter-spacing: -.5px;
    line-height: 1; color: var(--ink);
  }
  h1 em { font-style: italic; font-weight: 400; color: var(--accent-deep); }
  .stats { font-size: 12px; color: var(--ink-soft); letter-spacing: .5px; }
  .stats b { color: var(--accent-deep); font-weight: 600; }

  .layout { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .calendar-wrap { flex: 1 1 360px; }
  .editor-wrap { flex: 1 1 380px; }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 26px;
    box-shadow: 0 1px 2px rgba(43,58,69,.04), 0 8px 32px rgba(43,58,69,.05);
    border: 1px solid rgba(227,235,240,.7);
  }

  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .weekdays { margin-bottom: 10px; }
  .weekdays div {
    text-align: center; font-size: 10px; font-weight: 500;
    color: var(--ink-soft); padding: 4px 0; letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .day {
    aspect-ratio: 1; border-radius: 14px;
    background: transparent; border: 1px solid transparent;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    font-size: 13px; font-weight: 400;
    color: var(--ink); transition: all .22s cubic-bezier(.4,0,.2,1);
  }
  .day:hover { background: var(--card-soft); border-color: var(--line); }
  .day.empty { background: transparent; cursor: default; pointer-events: none; }
  .day.today { border-color: var(--accent); color: var(--accent-deep); font-weight: 500; }
  .day.today::after {
    content: ''; position: absolute; top: 7px; right: 7px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }
  .day.selected {
    background: var(--accent-deep); color: #fff; font-weight: 500;
    border-color: var(--accent-deep);
    box-shadow: 0 4px 14px rgba(91,139,173,.3);
  }
  .day.selected::after { background: rgba(255,255,255,.7); }
  .day.dimmed { opacity: .22; }

  .dots { position: absolute; bottom: 6px; display: flex; gap: 3px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; }
  .day.selected .dot { opacity: .9; }

  /* 标签筛选 */
  .tag-filter {
    margin-top: 22px; padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 8px;
    min-height: 24px; align-items: center;
  }
  .tag-filter .hint {
    color: var(--ink-soft); font-style: italic;
    font-family: "Cormorant Garamond", serif; font-size: 14px;
  }
  .filter-chip {
    font-size: 11px; font-weight: 400;
    padding: 5px 12px; border-radius: 20px;
    background: transparent; border: 1px solid var(--line);
    color: var(--ink-soft); cursor: pointer; transition: all .2s ease;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent-deep); }
  .filter-chip.active { background: var(--accent-deep); color: #fff; border-color: var(--accent-deep); }
  .filter-chip .cnt { opacity: .55; margin-left: 5px; font-size: 10px; }

  /* ===== 标签占比 ===== */
  .tag-share {
    margin-top: 24px; padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .tag-share-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  .tag-share-label {
    font-size: 9px; font-weight: 500; letter-spacing: 2.5px;
    color: var(--ink-soft); text-transform: uppercase;
  }
  .tag-share-total {
    font-family: "Cormorant Garamond", serif;
    font-style: italic; font-size: 13px; color: var(--ink-soft);
  }

  .share-bar {
    display: flex; width: 100%; height: 8px;
    border-radius: 20px; overflow: hidden;
    background: var(--card-soft);
    border: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .share-seg {
    height: 100%; transition: flex-basis .3s ease;
    position: relative;
  }
  .share-seg:not(:last-child)::after {
    content: ''; position: absolute; right: 0; top: 0;
    width: 1.5px; height: 100%; background: #fff;
  }

  .share-legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-row {
    display: flex; align-items: center; gap: 9px;
    font-size: 11px; color: var(--ink);
    cursor: pointer; padding: 2px 0; border-radius: 6px;
    transition: opacity .2s;
  }
  .legend-row:hover { opacity: .7; }
  .legend-row.active { color: var(--accent-deep); font-weight: 500; }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { flex: 1; }
  .legend-pct {
    font-family: "Cormorant Garamond", serif;
    font-style: italic; font-size: 13px; color: var(--ink-soft);
  }
  .legend-row.active .legend-pct { color: var(--accent-deep); }
  .share-empty {
    font-family: "Cormorant Garamond", serif;
    font-style: italic; font-size: 14px; color: var(--ink-soft);
    padding: 4px 0;
  }

  /* 编辑器 */
  .editor { display: flex; flex-direction: column; min-height: 480px; }
  .editor-date {
    font-family: "Cormorant Garamond", serif;
    font-size: 22px; font-weight: 500; font-style: italic;
    color: var(--accent-deep);
    margin-bottom: 18px; padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    letter-spacing: .3px;
  }
  .editor-date.empty-state { color: var(--ink-soft); }

  textarea {
    flex: 1; width: 100%; min-height: 240px;
    background: transparent; border: none; padding: 0;
    color: var(--ink); font-size: 15px; line-height: 1.85;
    font-family: inherit; font-weight: 300; outline: none; resize: none;
    letter-spacing: .2px;
  }
  textarea::placeholder { color: var(--ink-soft); opacity: .6; font-style: italic; }

  .tag-editor { padding-top: 16px; margin-top: 14px; border-top: 1px solid var(--line); }
  .tag-editor-label {
    font-size: 9px; font-weight: 500; letter-spacing: 2.5px;
    color: var(--ink-soft); margin-bottom: 10px; text-transform: uppercase;
  }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag-list:empty { display: none; }
  .tag {
    font-size: 11px; font-weight: 400;
    padding: 4px 10px 4px 12px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--ink); background: var(--card-soft);
    border: 1px solid var(--line);
  }
  .tag::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--dot-color, var(--accent));
  }
  .tag .x { cursor: pointer; opacity: .4; font-size: 13px; line-height: 1; margin-left: 2px; }
  .tag .x:hover { opacity: 1; }

  .tag-input {
    width: 100%; padding: 9px 0; border-radius: 0;
    background: transparent; border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink); font-size: 13px; outline: none;
    font-family: inherit; transition: border-color .2s;
  }
  .tag-input:focus { border-color: var(--accent); }
  .tag-input::placeholder { color: var(--ink-soft); opacity: .55; font-style: italic; }

  .save-hint {
    font-size: 10px; color: var(--ink-soft);
    text-align: right; margin-top: 12px; height: 14px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 400;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>November<em> diary</em></h1>
    <div class="stats"><b id="statsNum">0</b> / 30 written</div>
  </header>
  <div class="layout">
    <div class="calendar-wrap">
      <div class="card">
        <div class="weekdays">
          <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div>
          <div>Fri</div><div>Sat</div><div>Sun</div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="tag-filter" id="tagFilter"></div>

        <!-- 标签占比 -->
        <div class="tag-share" id="tagShare">
          <div class="tag-share-head">
            <span class="tag-share-label">Tag distribution</span>
            <span class="tag-share-total" id="shareTotal"></span>
          </div>
          <div class="share-bar" id="shareBar"></div>
          <div class="share-legend" id="shareLegend"></div>
        </div>
      </div>
    </div>
    <div class="editor-wrap">
      <div class="card editor">
        <div class="editor-date empty-state" id="editorDate">select a day to begin</div>
        <textarea id="diary" placeholder="write something……" disabled></textarea>
        <div class="tag-editor">
          <div class="tag-editor-label">Tags</div>
          <div class="tag-list" id="tagList"></div>
          <input class="tag-input" id="tagInput" placeholder="type & press enter" disabled>
        </div>
        <div class="save-hint" id="saveHint"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const YEAR = 2026;
  const MONTH = 10;
  const STORAGE_KEY = 'november-diary-v2';

  const grid = document.getElementById('grid');
  const diary = document.getElementById('diary');
  const editorDate = document.getElementById('editorDate');
  const saveHint = document.getElementById('saveHint');
  const statsNum = document.getElementById('statsNum');
  const tagList = document.getElementById('tagList');
  const tagInput = document.getElementById('tagInput');
  const tagFilter = document.getElementById('tagFilter');
  const shareBar = document.getElementById('shareBar');
  const shareLegend = document.getElementById('shareLegend');
  const shareTotal = document.getElementById('shareTotal');

  let selectedDay = null;
  let activeFilter = null;
  let data = load();

  function load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    const old = localStorage.getItem('november-diary-v1');
    if (old) {
      const entries = JSON.parse(old);
      const migrated = {};
      for (const k in entries) migrated[k] = { text: entries[k], tags: [] };
      return migrated;
    }
    return {};
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  const pad = n => String(n).padStart(2, '0');

  function tagColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    const hue = 195 + (h % 60);
    return `hsl(${hue}, 42%, 68%)`;
  }

  // 统计：标签 -> 出现次数（只统计有正文的日记）
  function tagCounts() {
    const map = new Map();
    for (const k in data) {
      const e = data[k];
      if (!e || !e.text || !e.text.trim()) continue;
      (e.tags || []).forEach(t => map.set(t, (map.get(t) || 0) + 1));
    }
    return map;
  }

  function allTags() {
    return [...tagCounts().entries()].sort((a, b) => b[1] - a[1]);
  }

  function render() {
    grid.innerHTML = '';
    const firstDay = new Date(YEAR, MONTH, 1).getDay();
    const offset = (firstDay + 6) % 7;
    const daysInMonth = new Date(YEAR, MONTH + 1, 0).getDate();
    const today = new Date();

    for (let i = 0; i < offset; i++) {
      const el = document.createElement('div');
      el.className = 'day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${YEAR}-${pad(MONTH + 1)}-${pad(d)}`;
      const entry = data[key];
      const el = document.createElement('div');
      el.className = 'day';
      el.textContent = d;

      if (today.getFullYear() === YEAR && today.getMonth() === MONTH && today.getDate() === d)
        el.classList.add('today');
      if (selectedDay === key) el.classList.add('selected');
      if (activeFilter && !(entry && entry.tags && entry.tags.includes(activeFilter)))
        el.classList.add('dimmed');

      if (entry && entry.tags && entry.tags.length) {
        const dots = document.createElement('div');
        dots.className = 'dots';
        entry.tags.slice(0, 3).forEach(t => {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.style.background = tagColor(t);
          dots.appendChild(dot);
        });
        el.appendChild(dots);
      }

      el.addEventListener('click', () => selectDay(key, d));
      grid.appendChild(el);
    }

    const count = Object.values(data).filter(e => e && e.text && e.text.trim()).length;
    statsNum.textContent = count;

    renderFilter();
    renderTagEditor();
    renderTagShare();
  }

  function renderFilter() {
    tagFilter.innerHTML = '';
    const tags = allTags();
    if (!tags.length) {
      tagFilter.innerHTML = '<span class="hint">no tags yet</span>';
      return;
    }
    tags.forEach(([name, cnt]) => {
      const chip = document.createElement('span');
      chip.className = 'filter-chip' + (activeFilter === name ? ' active' : '');
      chip.innerHTML = `${name}<span class="cnt">${cnt}</span>`;
      chip.addEventListener('click', () => {
        activeFilter = activeFilter === name ? null : name;
        render();
      });
      tagFilter.appendChild(chip);
    });
  }

  // ===== 标签占比渲染 =====
  function renderTagShare() {
    const tags = allTags();
    shareBar.innerHTML = '';
    shareLegend.innerHTML = '';

    if (!tags.length) {
      shareTotal.textContent = '';
      shareBar.style.display = 'none';
      shareLegend.innerHTML = '<div class="share-empty">no tags to show</div>';
      return;
    }
    shareBar.style.display = 'flex';

    const total = tags.reduce((s, [, c]) => s + c, 0);
    shareTotal.textContent = `${total} tag uses`;

    tags.forEach(([name, cnt]) => {
      const pct = cnt / total * 100;
      const color = tagColor(name);

      // 堆叠条
      const seg = document.createElement('div');
      seg.className = 'share-seg';
      seg.style.flex = `0 0 ${pct}%`;
      seg.style.background = color;
      seg.title = `${name} · ${pct.toFixed(1)}%`;
      shareBar.appendChild(seg);

      // 图例行
      const row = document.createElement('div');
      row.className = 'legend-row' + (activeFilter === name ? ' active' : '');
      row.innerHTML = `
        <span class="legend-dot" style="background:${color}"></span>
        <span class="legend-name">${escapeHtml(name)}</span>
        <span class="legend-pct">${pct.toFixed(1)}%</span>
      `;
      // 点图例也能筛选
      row.addEventListener('click', () => {
        activeFilter = activeFilter === name ? null : name;
        render();
      });
      shareLegend.appendChild(row);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function renderTagEditor() {
    tagList.innerHTML = '';
    if (!selectedDay) return;
    const entry = data[selectedDay] || { text: '', tags: [] };
    (entry.tags || []).forEach(t => {
      const span = document.createElement('span');
      span.className = 'tag';
      span.style.setProperty('--dot-color', tagColor(t));
      span.innerHTML = `${escapeHtml(t)}<span class="x" title="删除">×</span>`;
      span.querySelector('.x').addEventListener('click', () => {
        entry.tags = entry.tags.filter(x => x !== t);
        data[selectedDay] = entry;
        save(); render(); flashSaved();
      });
      tagList.appendChild(span);
    });
  }

  function selectDay(key, dayNum) {
    selectedDay = key;
    editorDate.textContent = `november ${dayNum}`;
    editorDate.classList.remove('empty-state');
    diary.disabled = false;
    tagInput.disabled = false;
    const entry = data[key] || { text: '', tags: [] };
    diary.value = entry.text || '';
    diary.focus();
    render();
  }

  let saveTimer = null;
  diary.addEventListener('input', () => {
    if (!selectedDay) return;
    if (!data[selectedDay]) data[selectedDay] = { text: '', tags: [] };
    data[selectedDay].text = diary.value;
    saveHint.textContent = 'saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      save(); flashSaved(); render();
    }, 400);
  });

  tagInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const val = tagInput.value.trim();
    if (!val || !selectedDay) return;
    if (!data[selectedDay]) data[selectedDay] = { text: '', tags: [] };
    const tags = data[selectedDay].tags || [];
    if (!tags.includes(val)) {
      tags.push(val);
      data[selectedDay].tags = tags;
      save(); render(); flashSaved();
    }
    tagInput.value = '';
  });

  function flashSaved() {
    saveHint.textContent = 'saved';
    setTimeout(() => { saveHint.textContent = ''; }, 1500);
  }

  render();
</script>
</body>
</html>
